name: actions.yml
on: [push]
jobs:
  Golang-check:
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut Code
        uses: actions/checkout@v5

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Running go program
        run: go run .



