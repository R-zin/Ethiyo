name: CI

on:
  push:
    branches: [main, new]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Verify module files
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y chromium

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector and coverage
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate coverage summary
        run: go tool cover -func=coverage.out | tee coverage.txt

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 14

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        continue-on-error: true

  e2e-integration:
    name: E2E tests (Headless Chromium)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y chromium

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests
        run: npm --prefix frontend test -- --run

      - name: Build frontend production bundle
        run: npm --prefix frontend run build

      - name: Build backend server
        run: |
          mkdir -p bin
          go build -o bin/server ./cmd/server

      - name: Start mock Chalo upstream server
        run: |
          node frontend/mock-chalo.cjs &
          echo "MOCK_PID=$!" >> $GITHUB_ENV
          sleep 1

      - name: Start backend server
        env:
          CHALO_BASE_URL: http://localhost:9099
        run: |
          ./bin/server > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health | grep -q "healthy"; then
              echo "Backend server is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Backend failed to start within 30 seconds:"
              cat backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Start frontend dev server
        run: |
          npm --prefix frontend run dev > frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 | grep -q "Ethiyo"; then
              echo "Frontend server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Frontend failed to start within 30 seconds:"
              cat frontend.log
              exit 1
            fi
            sleep 1
          done

      - name: Run browser E2E integration test suite
        env:
          BROWSER_PATH: /usr/bin/chromium
          SCREENSHOT_DIR: ${{ github.workspace }}/e2e-screenshots
          APP_URL: http://localhost:3000
        run: npm --prefix frontend run test:e2e

      - name: Upload E2E screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-devtools-screenshots
          path: |
            e2e-screenshots/
            backend.log
            frontend.log
          retention-days: 14

      - name: Teardown background servers
        if: always()
        run: |
          kill -9 $BACKEND_PID 2>/dev/null || true
          kill -9 $FRONTEND_PID 2>/dev/null || true
          kill -9 $MOCK_PID 2>/dev/null || true

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [quality, static-analysis, e2e-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build application
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/ethiyo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" ./cmd/server

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethiyo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v4
        continue-on-error: true
